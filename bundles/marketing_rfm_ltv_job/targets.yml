---
targets:
  dev:
    mode: development
    default: true
    variables:
      target_catalog: ${var.dev_catalog_name}
      pause_status: ${var.dev_pause_status}
      raw_schema: raw
      # Shares the per-user DLT schema, but the job writes its tables with a
      # `_job` suffix (table_suffix below) so they never collide with the DLT
      # pipeline's materialized views (stg_/slv_/gold_) in the same schema.
      stg_schema: ${var.dev_schema_name}
      int_schema: ${var.dev_schema_name}
      mart_schema: ${var.dev_schema_name}
      table_suffix: _job
    workspace:
      host: https://dbc-fbaeac02-351e.cloud.databricks.com/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE

  ci:
    mode: development
    variables:
      target_catalog: ${var.dev_catalog_name}
      pause_status: ${var.dev_pause_status}
      raw_schema: ${var.raw_schema_name}
      stg_schema: ${var.stg_schema_name}
      int_schema: ${var.int_schema_name}
      mart_schema: ${var.mart_schema_name}
      table_suffix: _job
    workspace:
      host: https://dbc-fbaeac02-351e.cloud.databricks.com/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - service_principal_name: ${var.sp_client_id}
        level: CAN_MANAGE
      - group_name: ${var.viewer_group_name}
        level: CAN_VIEW

  qa:
    mode: production
    variables:
      target_catalog: ${var.qa_catalog_name}
      pause_status: ${var.prod_pause_status}
      raw_schema: ${var.raw_schema_name}
      stg_schema: ${var.stg_schema_name}
      int_schema: ${var.int_schema_name}
      mart_schema: ${var.mart_schema_name}
      table_suffix: _job
    workspace:
      host: https://dbc-fbaeac02-351e.cloud.databricks.com/
      root_path: ${var.root_path}
    permissions:
      - service_principal_name: ${var.sp_client_id}
        level: CAN_MANAGE
      - group_name: ${var.viewer_group_name}
        level: CAN_VIEW

  prod:
    mode: production
    variables:
      target_catalog: ${var.prod_catalog_name}
      pause_status: ${var.prod_pause_status}
      marketing_source_path: s3://project-dbk-coreprod-bucket
      raw_schema: ${var.raw_schema_name}
      stg_schema: ${var.stg_schema_name}
      int_schema: ${var.int_schema_name}
      mart_schema: ${var.mart_schema_name}
      table_suffix: _job
    workspace:
      host: https://dbc-fbaeac02-351e.cloud.databricks.com/
      root_path: ${var.root_path}
    permissions:
      - service_principal_name: ${var.sp_client_id}
        level: CAN_MANAGE
      - group_name: ${var.viewer_group_name}
        level: CAN_VIEW
