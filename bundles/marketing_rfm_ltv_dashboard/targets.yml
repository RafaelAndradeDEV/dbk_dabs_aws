---
targets:
  dev:
    mode: development
    default: true
    variables:
      target_catalog: ${var.dev_catalog_name}
      mart_schema: ${var.dev_schema_name}
      dashboard_warehouse_id: b4578277be3230af
    workspace:
      host: https://dbc-fbaeac02-351e.cloud.databricks.com/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE

  ci:
    mode: development
    variables:
      target_catalog: ${var.dev_catalog_name}
      mart_schema: ${var.mart_schema_name}
    workspace:
      host: https://dbc-fbaeac02-351e.cloud.databricks.com/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - service_principal_name: ${var.sp_client_id}
        level: CAN_MANAGE
      - group_name: ${var.viewer_group_name}
        level: CAN_VIEW

  qa:
    mode: production
    variables:
      target_catalog: ${var.qa_catalog_name}
      mart_schema: ${var.mart_schema_name}
    workspace:
      host: https://dbc-fbaeac02-351e.cloud.databricks.com/
      root_path: ${var.root_path}
    permissions:
      - service_principal_name: ${var.sp_client_id}
        level: CAN_MANAGE
      - group_name: ${var.viewer_group_name}
        level: CAN_VIEW

  prod:
    mode: production
    variables:
      target_catalog: ${var.prod_catalog_name}
      mart_schema: ${var.mart_schema_name}
    workspace:
      host: https://dbc-fbaeac02-351e.cloud.databricks.com/
      root_path: ${var.root_path}
    permissions:
      - service_principal_name: ${var.sp_client_id}
        level: CAN_MANAGE
      - group_name: ${var.viewer_group_name}
        level: CAN_VIEW
