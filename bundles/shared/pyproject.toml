[project]
name = "shared-utils"
version = "0.1.0"
description = "Common utilities for Databricks bundles"
authors = [{ name = "Rafael Andrade" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "databricks-labs-dqx>=0.10",
    "databricks-dlt==0.3.0",
    "ruamel-yaml>=0.18.16",
    "sqlglot>=28.5.0"
]

[dependency-groups]
dev = [
    "pytest",
    "databricks-connect>=15.4,<15.5",
    "databricks-labs-dqx>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_utils"]
